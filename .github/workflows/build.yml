name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Remove old android folder (force fresh sync)
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Add Bluetooth permissions
        run: |
          FILE="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"\/>' "$FILE"
          sed -i '/<manifest/a <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"\/>' "$FILE"
          sed -i '/<manifest/a <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"\/>' "$FILE"
          sed -i '/<manifest/a <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/>' "$FILE"
          sed -i '/<manifest/a <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"\/>' "$FILE"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
