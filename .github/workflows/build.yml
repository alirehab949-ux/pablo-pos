name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: npm install --ignore-scripts
      - run: npm run build:win32
      - uses: actions/upload-artifact@v4
        with:
          name: PabloPOS-Setup
          path: dist/*.exe
