name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/; fi

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 --legacy-peer-deps
          npm install @capacitor-community/bluetooth-le --legacy-peer-deps

      - name: Initialize Capacitor Android & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Upgrade SDK to 34 for Bluetooth Compatibility
        run: |
          cd android
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 34/g' variables.gradle || true
          sed -i 's/targetSdkVersion = 33/targetSdkVersion = 34/g' variables.gradle || true
          sed -i 's/compileSdk = 33/compileSdk = 34/g' app/build.gradle || true
          sed -i 's/targetSdk = 33/targetSdk = 34/g' app/build.gradle || true

      - name: Fix Dex and Kotlin Compatibility Issues
        run: |
          cd android/app
          sed -i '/defaultConfig {/a \        multiDexEnabled true' build.gradle
          sed -i '/compileOptions {/,/}/c \    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }' build.gradle
          cd ..

      - name: Use Stable Gradle 8.2
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.2

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
