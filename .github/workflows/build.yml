name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create www folder (Fix Web Assets Error)
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<html><body><h1>Pablo POS App</h1></body></html>" > www/index.html
          fi

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Update SDK Version and Fix Gradle Config
        run: |
          find android -name "build.gradle" -o -name "variables.gradle" | while read file; do
            sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' "$file"
            sed -i 's/targetSdkVersion 33/targetSdkVersion 34/g' "$file"
            sed -i 's/compileSdk = 33/compileSdk = 34/g' "$file"
            sed -i 's/targetSdk = 33/targetSdk = 34/g' "$file"
            sed -i 's/compileSdkVersion = 33/compileSdkVersion = 34/g' "$file"
            sed -i 's/targetSdkVersion = 33/targetSdkVersion = 34/g' "$file"
          done
          
          mkdir -p android/gradle
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
